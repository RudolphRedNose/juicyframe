# Baza wiedzy heurystyki. Ceny w PLN, orientacyjne dla rynku wtórnego w Polsce (2026).
# fair  = typowa cena używanego egzemplarza w dobrym stanie
# good  = cena, poniżej której to okazja
# scam  = cena, poniżej której oferta jest podejrzanie tania (czerwona flaga)
# Pierwsze pasujące (regex, case-insensitive, po tytule+opisie) wygrywa - kolejność ma znaczenie.

