# Wzorce oznaczające przestarzałą / wykastrowaną architekturę. Odrzucane, chyba że cena <= symbolic_price.
obsolete_patterns:
  - "xeon e5-? ?26\\d\\d ?v[123]\\b"   # Xeon E5 v1-v3 (2012-2014)
  - "xeon e3-? ?12\\d\\d ?v[1-5]?\\b"
  - "xeon x5\\d{3}|xeon e5\\d{3}\\b"   # Westmere/Nehalem
  - "\\bceleron\\b"
  - "\\bpentium\\b"
  - "\\batom\\b"
  - "\\bcore ?2 ?(duo|quad)\\b"
  - "\\bi[357]-? ?[2-6]\\d{3}[a-z]{0,2}\\b"   # Core 2-6 gen (Sandy Bridge - Skylake)
  - "\\bi[357]-? ?[2-6]\\d{2}[a-z]?\\b"       # Core 1 gen (i5-750 itp.)
  - "\\bathlon\\b|\\bphenom\\b|\\bfx-? ?[4689]\\d{3}\\b"
  - "\\bgtx ?(7|9)\\d0\\b|\\bgtx ?10[35]0\\b"  # Kepler/Maxwell, GTX 1030/1050
  - "\\bddr3\\b"
  - "\\bn100\\b|\\bn95\\b|\\bn5095\\b|\\bj4125\\b|\\bj4105\\b"   # budżetowe mini PC

# Ukryte koszty - gdy wzorzec pasuje, dopisujemy ostrzeżenie i obniżamy wynik.
hidden_costs:
  - pattern: "bez zasilacza|brak zasilacza|bez zasilania"
    note: "Brak zasilacza - dolicz 60-150 zł (Tiny/Micro wymagają dedykowanego zasilacza)."
    penalty: 10
  - pattern: "bez dysku|brak dysku|bez ssd|brak ssd|bez hdd"
    note: "Brak dysku - dolicz 100-250 zł za NVMe."
    penalty: 8
  - pattern: "bez ram|brak ram|bez pamięci|brak pamięci|bez pamieci"
    note: "Brak RAM - dolicz 100-300 zł (SO-DIMM DDR4) lub więcej przy DDR5."
    penalty: 10
  - pattern: "\\bddr5\\b"
    note: "Platforma DDR5 - sprawdź, czy RAM jest w zestawie; dokupienie jest drogie."
    penalty: 3
  - pattern: "bez gwarancji|brak gwarancji|po gwarancji"
    note: "Brak gwarancji - ryzyko po stronie kupującego."
    penalty: 4
  - pattern: "bez systemu|brak systemu|bez windows|brak licencji"
    note: "Brak licencji Windows - istotne tylko, jeśli nie planujesz Linuksa."
    penalty: 0
  - pattern: "tylko odbiór|tylko odbior|bez wysyłki|bez wysylki"
    note: "Tylko odbiór osobisty - sprawdź lokalizację."
    penalty: 3
  - pattern: "\\bvpro\\b|hasło bios|haslo bios|zablokowany bios"
    note: "Możliwa blokada BIOS / vPro - sprawdź, czy BIOS jest odblokowany."
    penalty: 8

# Frazy sugerujące oszustwo (przedpłata poza OLX, kontakt poza platformą).
scam_phrases:
  - pattern: "tylko przedpłata|tylko przedplata|przedpłata na konto|przelew z góry"
    note: "Wymusza przedpłatę poza OLX."
    penalty: 25
  - pattern: "whatsapp|telegram|pisz na maila|kontakt mail"
    note: "Przenosi kontakt poza OLX."
    penalty: 15
  - pattern: "pilnie|pilna sprzedaż|wyjazd za granicę|wyjezdzam"
    note: "Presja czasu - typowy element scamu."
    penalty: 8
  - pattern: "nieotwieran|nie otwieran|folia|zaplombowan"
    note: "\"Nieotwierane\" przy niskiej cenie = częsty scam na nowy sprzęt."
    penalty: 5

# Dodatnie sygnały jakości.
positive_signals:
  - pattern: "faktur|fv 23|na firmę|vat 23"
    note: "Faktura VAT - zwykle sprzęt poleasingowy od firmy."
    bonus: 5
  - pattern: "gwarancj"
    note: "Deklarowana gwarancja."
    bonus: 4
  - pattern: "nvme|ssd"
    note: "Dysk SSD w zestawie."
    bonus: 2
  - pattern: "\\b(16|32|64) ?gb\\b"
    note: "Sensowna ilość RAM."
    bonus: 3
  - pattern: "poleasingow|leasing|korporac"
    note: "Sprzęt poleasingowy - zwykle dobry stan."
    bonus: 3
